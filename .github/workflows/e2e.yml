name: E2E (optional)

# ============================================================
# 可选 E2E 冒烟测试，手动触发（workflow_dispatch）。
# 默认对生产站点做只读冒烟，可用 E2E_BASE_URL 覆盖目标地址。
# 首次运行需安装浏览器（见下方 install 步骤）。
# ============================================================

on:
  workflow_dispatch:
    inputs:
      base-url:
        description: '目标站点（留空则用 https://ztcools.com）'
        required: false
        default: ''

jobs:
  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: lune-ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: lune-ui

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: lune-ui

      - name: Run smoke tests
        run: npm run test:e2e
        working-directory: lune-ui
        env:
          E2E_BASE_URL: ${{ github.event.inputs.base-url || 'https://ztcools.com' }}
