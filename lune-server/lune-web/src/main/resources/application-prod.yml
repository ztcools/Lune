# ============================================================
# Spring Boot 生产环境配置（Docker Compose Prod）
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/lune?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=true&requireSSL=true
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

server:
  shutdown: graceful
  # 后端只经由 nginx 访问（容器仅监听 127.0.0.1:8081），由 nginx 覆写
  # X-Forwarded-Proto/Host。开启后 Spring 才会按转发头还原请求协议 ——
  # ICP 备案接入 HTTPS 后，重定向和 Cookie 的 Secure 判定才不会退回 http。
  forward-headers-strategy: framework

logging:
  level:
    root: WARN
    com.lune: INFO
