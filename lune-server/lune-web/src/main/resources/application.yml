server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/lune?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: 86400000
  upload:
    path: ${UPLOAD_PATH:./upload}
    max-size: 104857600
  admin:
    default-password: ${ADMIN_DEFAULT_PASSWORD:admin123}
  # 文件存储：local(本地磁盘,默认) | oss(对象存储,需接入SDK)
  storage:
    type: ${STORAGE_TYPE:local}
  # OSS 预留配置（STORAGE_TYPE=oss 时生效，CDN/OSS 上线后填写）
  oss:
    endpoint: ${OSS_ENDPOINT:}
    bucket: ${OSS_BUCKET:}
    access-key: ${OSS_ACCESS_KEY:}
    secret-key: ${OSS_SECRET_KEY:}
    cdn-domain: ${OSS_CDN_DOMAIN:}
  security:
    # HSTS 仅在 HTTPS 生产环境开启（本地 HTTP 必须保持 false）
    hsts-enabled: ${HSTS_ENABLED:false}
  # GeoLite2 离线库路径（docker-compose 以只读挂载提供 /app/geoip）
  # 不打进 jar：66MB 会让镜像和每次 docker save 传输都白白变大，且该库需按月更新
  # 文件缺失时后端仅告警降级（只记 IP、不记地区），不影响启动
  geoip:
    path: ${GEOIP_DB_PATH:/app/geoip/GeoLite2-City.mmdb}
  # 访问日志保留天数（覆盖「最近 90 天趋势」的最大查询窗口），0 表示不清理
  visit-log:
    retention-days: ${VISIT_LOG_RETENTION_DAYS:90}

# Actuator health check for Docker
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /api/actuator
  endpoint:
    health:
      show-details: when-authorized
  # 邮件健康检查默认关闭（未配置真实邮箱时会拉低整体健康状态），
  # 配置 MAIL_HOST 后由 application-prod.yml 或环境变量按需开启
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
