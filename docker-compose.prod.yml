# ============================================================
# Lune - Docker Compose 生产环境
# 使用方式: docker compose -f docker-compose.prod.yml up -d
# 特点: Nginx 内嵌前端构建产物，只暴露 80 端口
# ============================================================

services:
  # ========== Nginx（含前端静态文件）==========
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: lune-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
      # ICP 备案下来后：放开 443 并挂载证书，同时启用 nginx.prod.conf
      # 底部的 HTTPS Server 预留块（步骤见 docs/DEPLOYMENT.md 第四章）
      # - "443:443"
    volumes:
      - upload_data:/var/www/upload:ro
      # - /etc/letsencrypt:/etc/nginx/ssl:ro
      # - ./certbot-webroot:/var/www/certbot   # certbot --webroot 续期用（宿主机同一目录）
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lune-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== Spring Boot 后端 ==========
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: lune-backend
    # 仅本地回环暴露（通过 nginx 代理访问）
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - upload_data:/app/upload
      # GeoLite2 离线库以只读挂载提供，不打进 jar/镜像：
      # 否则这 66MB 会跟着每次 docker save + scp 重传一遍（5Mbps 上行约 2 分钟）
      - ./data/geoip:/app/geoip:ro
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT:-465}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - UPLOAD_PATH=/app/upload
      - TZ=Asia/Shanghai
      # admin 账号首次创建时的初始密码（DataInitializer 只在空表时用一次）
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-admin123}
      # ===== ICP 备案 / CDN 上线后要用的开关 =====
      # 这几个 key 在 application.yml 里是读的，但此前没从 .env 透传进容器 ——
      # 也就是说在 /opt/lune/.env 里改 STORAGE_TYPE=oss 或 HSTS_ENABLED=true
      # 曾经完全不生效（容器内始终是默认值）。补上，让文档写的 Phase 2/3 真的可切。
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - OSS_ENDPOINT=${OSS_ENDPOINT:-}
      - OSS_BUCKET=${OSS_BUCKET:-}
      - OSS_ACCESS_KEY=${OSS_ACCESS_KEY:-}
      - OSS_SECRET_KEY=${OSS_SECRET_KEY:-}
      - OSS_CDN_DOMAIN=${OSS_CDN_DOMAIN:-}
      # HSTS 只能在证书配好之后开：HTTP 站点一旦下发 HSTS，浏览器会把
      # http:// 强制升级成 https:// 并记住一年，等于自己把站点锁死。
      - HSTS_ENABLED=${HSTS_ENABLED:-false}
      # 2C4G 服务器 JVM 限制：堆 512M，元空间 128M
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:MaxMetaspaceSize=128m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lune-network
    restart: always
    # 2C4G 服务器容器内存限制
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ========== MySQL 8.0 ==========
  mysql:
    image: mysql:8.0
    container_name: lune-mysql
    # 仅本地回环暴露
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: lune
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - lune-network
    restart: always
    # 2C4G 服务器限制：MySQL 内存最大 768M
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ========== Redis 7 ==========
  redis:
    image: redis:7-alpine
    container_name: lune-redis
    # 仅本地回环暴露
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - lune-network
    restart: always
    # 2C4G 服务器限制：Redis 最大 256M
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  redis_data:
  upload_data:

networks:
  lune-network:
    driver: bridge
