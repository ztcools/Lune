# ============================================================
# Lune Redis 7 配置
# ============================================================

# RDB 快照（每 60 秒至少 1000 个 key 变化时保存）
save 60 1000

# AOF 持久化
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 内存限制
maxmemory 128mb
maxmemory-policy allkeys-lru

# 日志级别
loglevel notice

# 禁用危险命令（生产环境）
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command KEYS ""
