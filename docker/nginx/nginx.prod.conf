# ============================================================
# Lune Nginx 生产环境配置
# 静态文件 + API 反向代理 + 安全加固 + 性能调优（2核4G）
# ============================================================

upstream backend {
    server backend:8081 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ========== 全局限流区（防爬虫 / 防爆破）==========
# API 通用：每 IP 每秒 10 个，允许突发 20
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# 登录/注册：每 IP 每分钟 5 个，严格防爆破
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_status 429;

# ========== HTTP Server ==========
server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 100M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 65;

    # ========== Gzip 压缩 ==========
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/x-javascript
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    # ========== 安全头 ==========
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # 内容安全策略（与后端兜底一致，Nginx 层先挡）
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; media-src 'self' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;

    # ========== 登录/注册强限流（防爆破）==========
    location ~ ^/api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # ========== API 代理到后端（含限流）==========
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;

        # 缓冲
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 32k;
    }

    # ========== 上传文件（Nginx 直接读取共享 Volume）==========
    # 文件由后端写入 upload_data volume，Nginx 从此路径直接提供服务
    location /upload/ {
        alias /var/www/upload/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        # 上传目录禁止当作脚本执行（安全）
        location ~* /upload/.*\.(php|jsp|asp|sh|py|pl|cgi)$ {
            deny all;
        }
    }

    # ========== 静态资源（带 hash，强缓存）==========
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ========== robots.txt ==========
    location = /robots.txt {
        root /usr/share/nginx/html;
        access_log off;
    }

    # ========== SPA 回退 ==========
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # HTML 不缓存（确保更新及时生效）
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ========== 屏蔽常见恶意扫描路径 ==========
    location ~* /\.(git|env|svn|hg) {
        deny all;
        return 404;
    }
}

