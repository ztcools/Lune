# ============================================================
# Lune Nginx 生产环境配置
# 静态文件 + API 反向代理 + 安全加固 + 性能调优（2核4G）
# ============================================================

upstream backend {
    server backend:8081 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream agent {
    server agent:8082 max_fails=3 fail_timeout=30s;
    keepalive 8;
}

# ========== 全局限流区（防爬虫 / 防爆破）==========
# API 通用：每 IP 每秒 10 个，允许突发 20
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
# 登录/注册：每 IP 每分钟 5 个，严格防爆破
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_status 429;

# ========== HTTP Server ==========
# server 级的公共配置（gzip / 安全头 / 所有 location）统一放在
# lune-common.conf，与下方 HTTPS 预留块共用同一份，避免两处配置漂移。
server {
    listen 80;
    server_name _;
    server_tokens off;

    include /etc/nginx/lune-common.conf;
}

