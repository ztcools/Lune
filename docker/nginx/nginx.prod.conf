# ============================================================
# Lune Nginx 生产环境配置
# 静态文件 + API 反向代理 + HTTPS + 安全加固 + 性能调优（2C4G）
# ============================================================

upstream backend {
    server backend:8081 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream agent {
    server agent:8082 max_fails=3 fail_timeout=30s;
    keepalive 8;
}

# ========== 全局限流区（防爬虫 / 防爆破）==========
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_status 429;

# ========== HTTP → HTTPS 重定向 ==========
server {
    listen 80;
    server_name ztcools.com;
    server_tokens off;

    # ACME 证书续期校验（如果后续切回 Let's Encrypt）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ========== HTTPS Server ==========
server {
    listen 443 ssl;
    http2 on;
    server_name ztcools.com;
    server_tokens off;

    # SSL 证书（由 docker-compose 挂载 /opt/lune/ssl/ → /etc/nginx/ssl/）
    ssl_certificate     /etc/nginx/ssl/ztcools.com_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/ztcools.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS（证书确认可用后在 .env 设 HSTS_ENABLED=true 再重启 backend；
    # 这里先保留向后端 SecurityHeadersFilter 一致的控制权 —— nginx 层暂不
    # 单独下发，等一轮部署确认 HTTPS 稳定后再打开下方两行）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/lune-common.conf;
}
