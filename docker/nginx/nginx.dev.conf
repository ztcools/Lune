# ============================================================
# Lune Nginx 开发环境配置
# 代理到 Vite Dev Server（HMR）+ Spring Boot Backend
# ============================================================

resolver 127.0.0.11 valid=30s ipv6=off;

upstream backend {
    server backend:8081;
}

upstream agent {
    server agent:8082;
}

upstream frontend {
    server frontend:5173;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # ========== Agent API 代理到 Agent 服务 ==========
    location /api/admin/agent/ {
        proxy_pass http://agent;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;  # SSE long connection
        proxy_buffering off;       # disable buffering for SSE
        chunked_transfer_encoding on;
    }

    # ========== API 代理到后端 ==========
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # ========== 上传文件代理到后端（后端 WebMvcConfig 处理） ==========
    location /upload/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 开发环境不要 immutable：后台换一张同名图后浏览器会一直用旧的，
        # 排查半天以为是上传坏了。跟生产保持一致，只给 7 天普通缓存。
        expires 7d;
    }

    # ========== 前端 Vite Dev Server（含 WebSocket HMR）==========
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket 支持（Vite HMR 需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;

        # 长连接超时
        proxy_read_timeout 86400s;
    }
}
