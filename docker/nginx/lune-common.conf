# ============================================================
# Lune Nginx 生产环境 —— server 级公共配置
#
# 从 nginx.prod.conf 的 HTTP server 里抽出来：ICP 备案下来后要再开一个
# 443 server，两份配置逐字复制一遍必然会漂移（改了 HTTP 忘了 HTTPS）。
# 现在两个 server 都 include 这一个文件，只保留各自的 listen / ssl_* 差异。
#
# 本文件只放 server 上下文的指令，由 nginx.prod.conf 在 server{} 内 include。
# ============================================================

client_max_body_size 100M;
client_body_timeout 30s;
client_header_timeout 30s;
keepalive_timeout 65;

# ========== Gzip 压缩 ==========
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/x-javascript
    image/svg+xml
    font/ttf
    font/woff
    font/woff2;

# ========== 安全头 ==========
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
# 内容安全策略（与后端兜底一致，Nginx 层先挡）
# 字体源为国内可达镜像 loli.net，不再放行大陆访问不到的 fonts.googleapis.com /
# fonts.gstatic.com（详见 lune-ui/index.html 的字体加载策略说明）
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; media-src 'self' https:; style-src 'self' 'unsafe-inline' https://fonts.loli.net; font-src 'self' https://gstatic.loli.net; script-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;

# ========== 登录/注册强限流（防爆破）==========
location ~ ^/api/auth/ {
    limit_req zone=auth_limit burst=5 nodelay;
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_read_timeout 60s;
}

# ========== API 代理到后端（含限流）==========
location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 超时
    proxy_connect_timeout 30s;
    proxy_read_timeout 120s;
    proxy_send_timeout 30s;

    # 缓冲
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 32k;
}

# ========== 上传文件（Nginx 直接读取共享 Volume）==========
# 文件由后端写入 upload_data volume，Nginx 从此路径直接提供服务
location /upload/ {
    alias /var/www/upload/;
    # 只用 expires，不写 add_header：原来这里多写了一条等价的
    # add_header Cache-Control "public, max-age=604800"，结果把 server 级的
    # 整套安全响应头（含 nosniff）挡在了本层之外 —— 用户上传的文件恰恰最需要
    # nosniff。expires 7d 自己就会发 Cache-Control: max-age=604800，等价且不截断继承。
    expires 7d;
    # 上传目录禁止当作脚本执行（安全）
    location ~* /upload/.*\.(php|jsp|asp|sh|py|pl|cgi)$ {
        deny all;
    }
}

# ========== 静态资源（带 hash，强缓存）==========
location /assets/ {
    alias /usr/share/nginx/html/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
    # 本 location 一旦出现 add_header，server 级的安全响应头就不再继承，
    # 这里把最关键的 nosniff 补回来（自托管字体也在这个目录下）
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
}

# ========== 自托管媒体（背景图 / 音乐，共约 18MB）==========
#
# 这些文件原先落到下面的 SPA 兜底 location，跟着吃到
# "no-cache, must-revalidate" —— 意味着每次进站都要重新校验
# 十几兆的背景图和 MP3。移动端体验很差，也白烧服务器上行带宽。
#
# 只写 expires、不写 add_header：nginx 的 add_header 只要在本层出现过，
# server 层的安全响应头就整套不再继承（见上面 /assets/ 的补救）。
# expires 走的是另一条路径，不会触发这个继承截断。
#
# 用 30d 而不是 1y+immutable：文件名不带 hash，站长在后台换一张同名
# 背景图时，immutable 会让老图片在客户端赖住整整一年。
location /media/ {
    root /usr/share/nginx/html;
    expires 30d;
    access_log off;
}

# ========== 中国地图 GeoJSON（582KB，后台大盘用）==========
# 行政区划边界不会变，同样别再跟着 SPA 的 no-cache 反复回传
location /maps/ {
    root /usr/share/nginx/html;
    expires 30d;
    access_log off;
}

# ========== robots.txt ==========
location = /robots.txt {
    root /usr/share/nginx/html;
    access_log off;
}

# ========== ACME 证书校验（Certbot webroot）==========
# 目录由 docker-compose.prod.yml 的 ./certbot-webroot 挂载提供；
# 未挂载时这里什么都不匹配，不影响其它 location。
location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    access_log off;
}

# ========== SPA 回退 ==========
location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;

    # HTML 不缓存（确保更新及时生效）。
    #
    # 用 expires -1 而不是 add_header Cache-Control "no-cache, must-revalidate"：
    # 后者会让本 location 不再继承 server 级的 add_header，也就是说**首页 HTML
    # 这个最需要 CSP / X-Frame-Options / nosniff 的响应，恰恰一条安全头都没有**
    # （后端 SecurityHeadersFilter 只覆盖 /api/，静态 HTML 由 nginx 直接发）。
    # expires -1 会发 Cache-Control: no-cache 且不触发继承截断。
    expires -1;
}

# ========== 屏蔽常见恶意扫描路径 ==========
location ~* /\.(git|env|svn|hg) {
    deny all;
    return 404;
}
