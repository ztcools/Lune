# ============================================================
# Lune - Docker Compose 开发环境
# 使用方式: docker compose -f docker-compose.dev.yml up -d
# 特点: 前端 Vite HMR 热更新 + 后端源码挂载
# ============================================================

services:
  # ========== Nginx 反向代理 ==========
  nginx:
    image: nginx:1.27-alpine
    container_name: lune-nginx-dev
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - lune-network
    restart: unless-stopped

  # ========== Spring Boot 后端 ==========
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: lune-backend-dev
    ports:
      - "8081:8081"
    volumes:
      - upload_data:/app/upload
      - maven_cache:/root/.m2
      # GeoLite2 离线库以只读挂载提供，不打进 jar/镜像（66MB，且需按月更新）
      # 文件缺失时后端会告警降级：只记 IP、不记地区
      - ./data/geoip:/app/geoip:ro
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-465}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-only-for-local-development}
      - UPLOAD_PATH=/app/upload
      - TZ=Asia/Shanghai
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-admin123}
      # 本地固定走磁盘：OSS / HSTS 是生产开关，dev 不透传（保持 application.yml 默认）
      - STORAGE_TYPE=local
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lune-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ========== Vue 前端（Vite Dev Server，HMR）==========
  frontend:
    build:
      context: ./lune-ui
      dockerfile: ../docker/frontend/Dockerfile.dev
    container_name: lune-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./lune-ui/src:/app/src:ro
      - ./lune-ui/public:/app/public:ro
      - ./lune-ui/index.html:/app/index.html:ro
      - ./lune-ui/vite.config.js:/app/vite.config.js:ro
      # 挂载宿主机 node_modules：避免容器内重复 npm ci，且新增依赖即刻生效
      - ./lune-ui/node_modules:/app/node_modules
    environment:
      - TZ=Asia/Shanghai
    networks:
      - lune-network
    restart: unless-stopped

  # ========== MySQL 8.0 ==========
  mysql:
    image: mysql:8.0
    container_name: lune-mysql-dev
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-dev-root-password}
      MYSQL_DATABASE: lune
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data_dev:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - lune-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-dev-root-password}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ========== Redis 7 ==========
  redis:
    image: redis:7-alpine
    container_name: lune-redis-dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data_dev:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - lune-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data_dev:
  redis_data_dev:
  upload_data:
  maven_cache:

networks:
  lune-network:
    driver: bridge
