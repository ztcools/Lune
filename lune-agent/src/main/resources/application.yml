server:
  port: ${AGENT_PORT:8082}
  shutdown: graceful

spring:
  threads:
    virtual:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

app:
  jwt:
    secret: ${JWT_SECRET:}
  agent:
    base-url: ${AGENT_BASE_URL:https://aigw.phigent.cn}
    model: ${AGENT_MODEL:deepseek/deepseek-v4-flash}
    api-key: ${AGENT_API_KEY:}
    max-tokens: 4096
    temperature: 0.7
    max-tool-iterations: 8
    sse-timeout-seconds: 300
  lune:
    base-url: ${LUNE_API_URL:http://localhost:8081}

logging:
  level:
    com.lune.agent: ${LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /api/actuator
  endpoint:
    health:
      show-details: when-authorized
