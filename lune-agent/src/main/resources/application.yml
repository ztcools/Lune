server:
  port: ${AGENT_PORT:8082}

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

app:
  agent:
    base-url: ${AGENT_BASE_URL:https://aigw.phigent.cn}
    model: ${AGENT_MODEL:deepseek/deepseek-v4-flash}
    api-key: ${AGENT_API_KEY:}
    max-tokens: 4096
    temperature: 0.7
    max-tool-iterations: 5
    sse-timeout-seconds: 300
  lune:
    base-url: ${LUNE_API_URL:http://localhost:8081}

logging:
  level:
    com.lune.agent: ${LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /api/actuator
